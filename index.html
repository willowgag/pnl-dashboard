<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PnL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0E0B14;
    --on-violet: #0E0B14;
    --violet: #A78BFA;
    --violet-deep: #C4B5FD;
    --lavender: #1E1830;
    --lavender-soft: #161222;
    --ink: #F2F0F7;
    --slate: #9C96AD;
    --slate-light: #6C6680;
    --green: #4ADE80;
    --green-bg: #14291C;
    --red: #F87171;
    --red-bg: #2E1414;
    --border: #2A2238;
    --white: #0E0B14;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 60px;
    color-scheme: dark;
  }

  .container {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 18px 0;
  }

  .brand-tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    margin-bottom: 24px;
    scrollbar-width: none;
  }
  .brand-tabs::-webkit-scrollbar { display: none; }

  .brand-tab {
    flex-shrink: 0;
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    color: var(--slate);
    background: var(--lavender-soft);
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
  }
  .brand-tab:hover { background: var(--lavender); }
  .brand-tab.active {
    background: var(--violet);
    color: var(--on-violet);
  }

  .brand-tab.add-tab {
    background: var(--white);
    color: var(--violet);
    border: 1.5px dashed var(--violet);
  }
  .brand-tab.add-tab:hover {
    background: var(--lavender-soft);
  }

  .tab-remove {
    margin-left: 7px;
    opacity: 0.5;
    font-size: 15px;
    line-height: 1;
  }
  .tab-remove:hover {
    opacity: 1;
  }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.65);
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }
  .modal-overlay.open {
    display: flex;
  }

  .modal-card {
    background: var(--lavender-soft);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 24px 22px;
    max-width: 380px;
    width: 100%;
    box-shadow: 0 20px 50px rgba(76, 29, 149, 0.25);
  }

  .modal-title {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 18px;
  }

  .modal-label {
    display: block;
    margin-bottom: 14px;
  }
  .modal-label span {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--slate);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
  }
  .modal-label input {
    width: 100%;
    padding: 11px 13px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: var(--ink);
  }
  .modal-label input:focus {
    outline: 2px solid var(--violet);
    outline-offset: 1px;
  }

  .modal-error {
    color: var(--red);
    font-size: 13px;
    min-height: 18px;
    margin-bottom: 6px;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 10px;
  }
  .modal-btn {
    flex: 1;
    padding: 11px;
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    border: none;
    cursor: pointer;
  }
  .modal-btn.secondary {
    background: var(--lavender-soft);
    color: var(--slate);
  }
  .modal-btn.secondary:hover {
    background: var(--lavender);
  }
  .modal-btn.primary {
    background: var(--violet);
    color: var(--on-violet);
  }
  .modal-btn.primary:hover {
    background: var(--violet-deep);
  }

  .hero-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--slate);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
  }

  .hero-date {
    font-size: 13px;
    color: var(--slate-light);
    margin-bottom: 14px;
  }

  .hero-number {
    font-family: 'Fraunces', serif;
    font-size: 54px;
    font-weight: 500;
    line-height: 1;
    letter-spacing: -0.02em;
    margin-bottom: 4px;
  }
  .hero-number.profit { color: var(--green); }
  .hero-number.loss { color: var(--red); }

  .hero-margin {
    font-size: 14px;
    color: var(--slate);
    margin-bottom: 28px;
  }
  .hero-margin .pill {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 12px;
    margin-right: 6px;
  }
  .pill.profit { background: var(--green-bg); color: var(--green); }
  .pill.loss { background: var(--red-bg); color: var(--red); }

  .ladder {
    background: var(--lavender-soft);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px 18px;
    margin-bottom: 28px;
  }

  .ladder-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--violet-deep);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 16px;
  }

  .ladder-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 0;
  }
  .ladder-row + .ladder-row {
    border-top: 1px solid var(--border);
  }

  .ladder-label {
    flex: 1;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
  }
  .ladder-label.sub { color: var(--slate); font-weight: 400; font-size: 13px; padding-left: 12px; }

  .ladder-value {
    font-size: 14px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .ladder-value.neg { color: var(--red); }
  .ladder-value.final {
    font-size: 16px;
  }
  .ladder-value.final.profit { color: var(--green); }
  .ladder-value.final.loss { color: var(--red); }

  .ladder-bar-track {
    width: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
    margin-top: 10px;
    margin-bottom: 4px;
  }
  .ladder-bar-fill {
    height: 100%;
    background: var(--violet);
    border-radius: 3px;
    transition: width 0.4s ease;
  }

  .section-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 14px;
  }

  .history-item {
    border: 1px solid var(--border);
    border-radius: 14px;
    margin-bottom: 10px;
    overflow: hidden;
  }

  .history-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    cursor: pointer;
  }

  .history-date {
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
  }
  .history-date .dow {
    color: var(--slate-light);
    font-weight: 400;
    font-size: 12px;
    margin-left: 6px;
  }

  .history-profit {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .history-profit-value {
    font-size: 15px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .history-profit-value.profit { color: var(--green); }
  .history-profit-value.loss { color: var(--red); }

  .chevron {
    width: 16px;
    height: 16px;
    color: var(--slate-light);
    transition: transform 0.2s ease;
    flex-shrink: 0;
  }
  .history-item.expanded .chevron { transform: rotate(180deg); }

  .history-detail {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.25s ease;
    background: var(--lavender-soft);
  }
  .history-item.expanded .history-detail {
    max-height: 300px;
  }
  .history-detail-inner { padding: 4px 16px 16px; }

  .detail-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    padding: 6px 0;
  }
  .detail-row-label { color: var(--slate); }
  .detail-row-value { font-weight: 600; font-variant-numeric: tabular-nums; }
  .detail-row-value.neg { color: var(--red); }

  .range-picker {
    display: flex;
    gap: 10px;
    margin-bottom: 24px;
  }
  .range-picker label {
    flex: 1;
  }
  .range-picker-text {
    font-size: 11px;
    font-weight: 600;
    color: var(--slate);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
    display: block;
  }
  .range-picker input[type="date"] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: var(--ink);
    background: var(--white);
  }
  .range-picker input[type="date"]:focus {
    outline: 2px solid var(--violet);
    outline-offset: 1px;
  }

  .cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .cal-nav {
    width: 36px;
    height: 36px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--lavender-soft);
    color: var(--violet-deep);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    flex-shrink: 0;
  }
  .cal-nav:hover {
    background: var(--lavender);
  }
  .cal-month-info {
    text-align: center;
  }
  .cal-month-label {
    font-size: 15px;
    font-weight: 700;
    color: var(--ink);
  }
  .cal-month-total {
    font-size: 13px;
    font-weight: 600;
    margin-top: 2px;
  }
  .cal-month-total.profit { color: var(--green); }
  .cal-month-total.loss { color: var(--red); }
  .cal-month-days {
    color: var(--slate);
    font-weight: 400;
  }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
    margin-bottom: 4px;
  }
  .cal-dow {
    text-align: center;
    font-size: 11px;
    font-weight: 600;
    color: var(--slate-light);
    text-transform: uppercase;
    padding-bottom: 4px;
  }
  .cal-cell {
    aspect-ratio: 1;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    font-variant-numeric: tabular-nums;
  }
  .cal-cell-empty {
    background: transparent;
  }
  .cal-cell-nodata {
    background: var(--lavender-soft);
    border: 1px solid var(--border);
  }
  .cal-cell-nodata .cal-cell-day {
    color: var(--slate-light);
  }
  .cal-cell-profit {
    background: var(--green-bg);
    border: 1px solid rgba(74, 222, 128, 0.35);
    cursor: pointer;
  }
  .cal-cell-loss {
    background: var(--red-bg);
    border: 1px solid rgba(248, 113, 113, 0.35);
    cursor: pointer;
  }
  .cal-cell-profit:active, .cal-cell-loss:active {
    transform: scale(0.95);
  }
  .cal-cell-day {
    font-size: 11px;
    color: var(--slate);
  }
  .cal-cell-profit .cal-cell-day { color: var(--green); }
  .cal-cell-loss .cal-cell-day { color: var(--red); }
  .cal-cell-val {
    font-size: 12px;
    font-weight: 700;
  }
  .cal-cell-profit .cal-cell-val { color: var(--green); }
  .cal-cell-loss .cal-cell-val { color: var(--red); }

  .cal-detail-card {
    background: var(--lavender-soft);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-top: 14px;
  }
  .cal-detail-date {
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 10px;
  }

  .loading, .empty-state {
    text-align: center;
    color: var(--slate);
    font-size: 14px;
    padding: 60px 20px;
  }
  .empty-state-icon {
    font-size: 32px;
    margin-bottom: 10px;
  }

  .error-state {
    background: var(--red-bg);
    color: var(--red);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 13px;
    margin-bottom: 20px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="brand-tabs" id="brandTabs"></div>
  <div id="content"></div>
</div>

<div class="modal-overlay" id="addBrandModal">
  <div class="modal-card">
    <div class="modal-title">Add a brand</div>
    <label class="modal-label">
      <span>Brand name</span>
      <input type="text" id="newBrandName" placeholder="e.g. Soléa">
    </label>
    <label class="modal-label">
      <span>Published CSV link</span>
      <input type="text" id="newBrandUrl" placeholder="https://docs.google.com/spreadsheets/...">
    </label>
    <div class="modal-error" id="addBrandError"></div>
    <div class="modal-actions">
      <button class="modal-btn secondary" onclick="closeAddBrandModal()">Cancel</button>
      <button class="modal-btn primary" onclick="handleAddBrand()">Add brand</button>
    </div>
  </div>
</div>

<script>
const DEFAULT_BRANDS = [
  {
    id: 'store1',
    name: 'New Store',
    csvUrl: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTWHLWFW9GqjbnpQDkOSzbIrW8dKAurAXgypXAWzAu5BA1VFAZqn3eZwFUFWv5rhIk2M-iuKIfUZ0b-/pub?gid=420928309&single=true&output=csv'
  }
];

// Apps Script web app URL — handles brand list GET/POST so it syncs across all devices
const BRANDS_API_URL = 'https://script.google.com/macros/s/AKfycbxPqJ9tNVCRa97a6o-p30k28ZyPuQ-UcPVCBxnolC3DD4IXFtogstHYip5hAgrwDcfU-g/exec';

function brandNameToId(name) {
  return 'brand_' + name.toLowerCase().replace(/[^a-z0-9]+/g, '_');
}

async function fetchBrandsFromServer() {
  try {
    const res = await fetch(BRANDS_API_URL + '?action=getBrands');
    if (!res.ok) throw new Error('Server error');
    const data = await res.json();
    if (!data.brands || data.brands.length === 0) return DEFAULT_BRANDS;
    return data.brands.map(b => ({
      id: brandNameToId(b.name),
      name: b.name,
      csvUrl: b.csvUrl
    }));
  } catch (e) {
    console.error('Could not load brands from server, using defaults', e);
    return DEFAULT_BRANDS;
  }
}

async function postBrandAction(payload) {
  const res = await fetch(BRANDS_API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight on Apps Script
    body: JSON.stringify(payload)
  });
  if (!res.ok) throw new Error('Could not save changes to the server');
  return res.json();
}

let BRANDS = DEFAULT_BRANDS; // populated by initBrands() before first render

let currentBrand = BRANDS[0].id;
let brandDataCache = {};

const content = document.getElementById('content');
const brandTabsEl = document.getElementById('brandTabs');

function parseCSV(text) {
  const lines = text.trim().split('\n').filter(l => l.trim().length > 0);
  const rows = [];
  for (const line of lines) {
    const cells = line.split(',').map(c => c.replace(/^"|"$/g, '').trim());
    rows.push(cells);
  }
  return rows;
}

function findHeaderRowIndex(rows) {
  return rows.findIndex(r => r[0] === 'Date' && r.some(c => c.includes('GrossRevenue')));
}

function parseNum(val) {
  if (val === undefined || val === '' || val === null) return null;
  const isPercent = val.includes('%');
  const n = parseFloat(val.replace(/[^0-9.\-]/g, ''));
  if (isNaN(n)) return null;
  return isPercent ? n / 100 : n;
}

function isValidDate(str) {
  return /^\d{4}-\d{2}-\d{2}$/.test(str);
}

// Maps a header cell's text to a canonical field name.
// Handles different template versions (v5 had no FX-locked columns, v6 added them, etc)
function mapHeaderToField(headerText) {
  const h = headerText.trim();
  if (h === 'Date') return 'date';
  if (h.includes('GrossRevenue')) return 'grossRevenue';
  if (h.includes('RealFees')) return 'realFees';
  if (h.startsWith('NetRevenue') && h.includes('Native')) return 'netRevenueNative';
  if (h.startsWith('NetRevenue') && h.includes('USD')) return 'netRevenueUSD';
  if (h.startsWith('AdSpend') && h.includes('Native')) return 'adSpendNative';
  if (h.startsWith('AdSpend') && h.includes('USD')) return 'adSpendUSD';
  if (h.includes('COGS')) return 'cogsUSD';
  if (h.includes('NetProfit')) return 'netProfitUSD';
  if (h.includes('Margin')) return 'marginPct';
  if (h.includes('Status')) return 'status';
  return null; // unrecognized column (e.g. RevFXRate_Locked, AdFXRate_Locked) — ignored
}

function rowsToRecords(rows) {
  const headerIdx = findHeaderRowIndex(rows);
  if (headerIdx === -1) return [];

  const headerRow = rows[headerIdx];
  const fieldByColumn = headerRow.map(mapHeaderToField);

  const records = [];
  for (let i = headerIdx + 1; i < rows.length; i++) {
    const r = rows[i];
    if (!r[0] || !isValidDate(r[0])) continue;

    const rec = {
      date: null, grossRevenue: null, realFees: null,
      netRevenueNative: null, netRevenueUSD: null,
      adSpendNative: null, adSpendUSD: null,
      cogsUSD: null, netProfitUSD: null, marginPct: null
    };

    fieldByColumn.forEach((field, colIdx) => {
      if (!field || field === 'status') return;
      const rawVal = r[colIdx];
      rec[field] = field === 'date' ? rawVal : parseNum(rawVal);
    });

    if (rec.netProfitUSD !== null) records.push(rec);
  }
  records.sort((a, b) => b.date.localeCompare(a.date));
  return records;
}

async function fetchBrandData(brand) {
  if (brandDataCache[brand.id]) return brandDataCache[brand.id];
  const res = await fetch(brand.csvUrl);
  if (!res.ok) throw new Error('Could not load data for ' + brand.name);
  const text = await res.text();
  const rows = parseCSV(text);
  const records = rowsToRecords(rows);
  brandDataCache[brand.id] = records;
  return records;
}

function fmtUSD(n) {
  if (n === null || n === undefined) return '—';
  const sign = n < 0 ? '-' : '';
  return sign + '$' + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function fmtPct(n) {
  if (n === null || n === undefined) return '—';
  return (n * 100).toFixed(1) + '%';
}

function fmtDateLong(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
}

function fmtDateShort(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function fmtDow(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('en-US', { weekday: 'short' });
}

function statusClass(n) {
  return n >= 0 ? 'profit' : 'loss';
}

function renderTabs() {
  brandTabsEl.innerHTML = '';
  const allTabs = [...BRANDS, { id: '__all__', name: 'All Brands' }];
  allTabs.forEach(b => {
    const tab = document.createElement('div');
    tab.className = 'brand-tab' + (b.id === currentBrand ? ' active' : '');
    tab.onclick = () => { currentBrand = b.id; renderTabs(); renderContent(); };

    if (b.id === '__all__') {
      tab.textContent = b.name;
    } else {
      const label = document.createElement('span');
      label.textContent = b.name;
      tab.appendChild(label);

      tab.ondblclick = (e) => {
        e.stopPropagation();
        const newName = prompt('Rename this brand:', b.name);
        if (newName && newName.trim() && newName.trim() !== b.name) {
          const oldName = b.name;
          const newNameTrimmed = newName.trim();
          postBrandAction({ action: 'renameBrand', oldName, newName: newNameTrimmed })
            .then(() => {
              const brand = BRANDS.find(x => x.id === b.id);
              brand.name = newNameTrimmed;
              brand.id = brandNameToId(newNameTrimmed);
              if (currentBrand === b.id) currentBrand = brand.id;
              renderTabs();
              renderContent();
            })
            .catch(() => alert('Could not rename. Check your connection and try again.'));
        }
      };

      const removeBtn = document.createElement('span');
      removeBtn.className = 'tab-remove';
      removeBtn.textContent = '×';
      removeBtn.onclick = (e) => {
        e.stopPropagation();
        removeBrand(b.id);
      };
      tab.appendChild(removeBtn);
    }

    brandTabsEl.appendChild(tab);
  });

  const addTab = document.createElement('div');
  addTab.className = 'brand-tab add-tab';
  addTab.textContent = '+ Add brand';
  addTab.onclick = openAddBrandModal;
  brandTabsEl.appendChild(addTab);
}

function openAddBrandModal() {
  document.getElementById('addBrandModal').classList.add('open');
  document.getElementById('newBrandName').value = '';
  document.getElementById('newBrandUrl').value = '';
  document.getElementById('addBrandError').textContent = '';
  setTimeout(() => document.getElementById('newBrandName').focus(), 50);
}

function closeAddBrandModal() {
  document.getElementById('addBrandModal').classList.remove('open');
}

async function handleAddBrand() {
  const name = document.getElementById('newBrandName').value.trim();
  const url = document.getElementById('newBrandUrl').value.trim();
  const errorEl = document.getElementById('addBrandError');

  if (!name) {
    errorEl.textContent = 'Enter a name for this brand.';
    return;
  }
  if (!url || !url.startsWith('https://docs.google.com/')) {
    errorEl.textContent = 'Paste a valid Google Sheets published CSV link.';
    return;
  }
  if (BRANDS.some(b => b.name.toLowerCase() === name.toLowerCase())) {
    errorEl.textContent = 'A brand with this name already exists.';
    return;
  }

  errorEl.textContent = 'Saving…';
  errorEl.style.color = 'var(--slate)';
  try {
    await postBrandAction({ action: 'addBrand', name, csvUrl: url });
    const id = brandNameToId(name);
    BRANDS.push({ id, name, csvUrl: url });
    currentBrand = id;
    closeAddBrandModal();
    renderTabs();
    renderContent();
  } catch (e) {
    errorEl.textContent = 'Could not save. Check your connection and try again.';
    errorEl.style.color = 'var(--red)';
  }
}

async function removeBrand(id) {
  if (!confirm('Remove this brand from the dashboard?')) return;
  const brand = BRANDS.find(b => b.id === id);
  if (!brand) return;
  try {
    await postBrandAction({ action: 'removeBrand', name: brand.name });
    BRANDS = BRANDS.filter(b => b.id !== id);
    delete brandDataCache[id];
    if (BRANDS.length === 0) BRANDS = DEFAULT_BRANDS.slice();
    currentBrand = BRANDS[0].id;
    renderTabs();
    renderContent();
  } catch (e) {
    alert('Could not remove this brand. Check your connection and try again.');
  }
}

function renderBreakdownLadder(rec) {
  const maxVal = Math.max(rec.netRevenueUSD || 0, 1);
  const bar = (val) => Math.min(100, Math.max(2, (Math.abs(val || 0) / maxVal) * 100));

  return `
    <div class="ladder">
      <div class="ladder-title">Breakdown</div>

      <div class="ladder-row">
        <div class="ladder-label">Net Revenue</div>
        <div class="ladder-value">${fmtUSD(rec.netRevenueUSD)}</div>
      </div>
      <div class="ladder-bar-track"><div class="ladder-bar-fill" style="width:${bar(rec.netRevenueUSD)}%"></div></div>

      <div class="ladder-row">
        <div class="ladder-label sub">− Ad spend</div>
        <div class="ladder-value neg">${fmtUSD(rec.adSpendUSD)}</div>
      </div>

      <div class="ladder-row">
        <div class="ladder-label sub">− COGS</div>
        <div class="ladder-value neg">${fmtUSD(rec.cogsUSD)}</div>
      </div>

      <div class="ladder-row">
        <div class="ladder-label" style="font-weight:700;">Net Profit</div>
        <div class="ladder-value final ${statusClass(rec.netProfitUSD)}">${fmtUSD(rec.netProfitUSD)}</div>
      </div>
    </div>
  `;
}

function buildRecordsByDate(records) {
  const map = {};
  records.forEach(r => { map[r.date] = r; });
  return map;
}

function renderCalendarMonth(recordsByDate, year, month, isAllBrands) {
  // month is 0-indexed (0 = January)
  const selectFn = isAllBrands ? 'selectAllBrandsCalendarDay' : 'selectCalendarDay';
  const navFn = isAllBrands ? 'changeAllBrandsCalendarMonth' : 'changeCalendarMonth';
  const detailId = isAllBrands ? 'allBrandsCalDayDetail' : 'calDayDetail';

  const firstOfMonth = new Date(year, month, 1);
  const startWeekday = firstOfMonth.getDay(); // 0 = Sunday
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const monthLabel = firstOfMonth.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

  let monthTotal = 0;
  let daysWithData = 0;

  const dayCells = [];
  for (let i = 0; i < startWeekday; i++) {
    dayCells.push('<div class="cal-cell cal-cell-empty"></div>');
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const rec = recordsByDate[dateStr];
    if (rec) {
      monthTotal += rec.netProfitUSD || 0;
      daysWithData++;
      const cls = statusClass(rec.netProfitUSD);
      const compactVal = fmtUSDCompact(rec.netProfitUSD);
      dayCells.push(`
        <div class="cal-cell cal-cell-${cls}" data-date="${dateStr}" onclick="${selectFn}('${dateStr}')">
          <div class="cal-cell-day">${d}</div>
          <div class="cal-cell-val">${compactVal}</div>
        </div>
      `);
    } else {
      dayCells.push(`
        <div class="cal-cell cal-cell-nodata">
          <div class="cal-cell-day">${d}</div>
        </div>
      `);
    }
  }

  const dowLabels = ['S','M','T','W','T','F','S'];

  return `
    <div class="cal-header">
      <button class="cal-nav" onclick="${navFn}(-1)" aria-label="Previous month">‹</button>
      <div class="cal-month-info">
        <div class="cal-month-label">${monthLabel}</div>
        <div class="cal-month-total ${monthTotal >= 0 ? 'profit' : 'loss'}">${fmtUSD(monthTotal)} <span class="cal-month-days">· ${daysWithData} day${daysWithData !== 1 ? 's' : ''}</span></div>
      </div>
      <button class="cal-nav" onclick="${navFn}(1)" aria-label="Next month">›</button>
    </div>
    <div class="cal-grid">
      ${dowLabels.map(l => `<div class="cal-dow">${l}</div>`).join('')}
      ${dayCells.join('')}
    </div>
    <div id="${detailId}"></div>
  `;
}

function fmtUSDCompact(n) {
  if (n === null || n === undefined) return '—';
  const sign = n < 0 ? '-' : '';
  const abs = Math.abs(n);
  if (abs >= 1000) return sign + '$' + (abs / 1000).toFixed(1) + 'k';
  return sign + '$' + Math.round(abs);
}

let calState = { year: null, month: null, recordsByDate: null, selectedDate: null };

window.changeCalendarMonth = function(delta) {
  calState.month += delta;
  if (calState.month > 11) { calState.month = 0; calState.year++; }
  if (calState.month < 0) { calState.month = 11; calState.year--; }
  calState.selectedDate = null;
  document.getElementById('calContainer').innerHTML = renderCalendarMonth(calState.recordsByDate, calState.year, calState.month);
};

window.selectCalendarDay = function(dateStr) {
  const rec = calState.recordsByDate[dateStr];
  const detailEl = document.getElementById('calDayDetail');
  if (!rec) { detailEl.innerHTML = ''; return; }
  if (calState.selectedDate === dateStr) {
    calState.selectedDate = null;
    detailEl.innerHTML = '';
    return;
  }
  calState.selectedDate = dateStr;
  detailEl.innerHTML = `
    <div class="cal-detail-card">
      <div class="cal-detail-date">${fmtDateLong(rec.date)}</div>
      <div class="detail-row"><span class="detail-row-label">Net Revenue</span><span class="detail-row-value">${fmtUSD(rec.netRevenueUSD)}</span></div>
      <div class="detail-row"><span class="detail-row-label">Ad Spend</span><span class="detail-row-value neg">${fmtUSD(rec.adSpendUSD)}</span></div>
      <div class="detail-row"><span class="detail-row-label">COGS</span><span class="detail-row-value neg">${fmtUSD(rec.cogsUSD)}</span></div>
      <div class="detail-row"><span class="detail-row-label">Margin</span><span class="detail-row-value">${fmtPct(rec.marginPct)}</span></div>
      <div class="detail-row" style="border-top:1px solid var(--border);margin-top:6px;padding-top:10px;">
        <span class="detail-row-label" style="font-weight:700;color:var(--ink);">Net Profit</span>
        <span class="detail-row-value ${statusClass(rec.netProfitUSD)}" style="font-weight:700;">${fmtUSD(rec.netProfitUSD)}</span>
      </div>
    </div>
  `;
};

async function renderSingleBrand(brand) {
  content.innerHTML = '<div class="loading">Loading…</div>';
  try {
    const records = await fetchBrandData(brand);
    if (records.length === 0) {
      content.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📊</div>No complete days yet.<br>Check back once a full day of data has landed.</div>';
      return;
    }
    const latest = records[0];
    const { from, to } = defaultRangeDates();

    const recordsByDate = buildRecordsByDate(records);
    const latestDateParts = latest.date.split('-').map(Number);
    calState = { year: latestDateParts[0], month: latestDateParts[1] - 1, recordsByDate, selectedDate: null };

    content.innerHTML = `
      <div class="hero-label">${brand.name} — Net Profit</div>
      <div class="hero-date">${fmtDateLong(latest.date)}</div>
      <div class="hero-number ${statusClass(latest.netProfitUSD)}">${fmtUSD(latest.netProfitUSD)}</div>
      <div class="hero-margin">
        <span class="pill ${statusClass(latest.netProfitUSD)}">${latest.netProfitUSD >= 0 ? 'Profit' : 'Loss'}</span>
        ${fmtPct(latest.marginPct)} margin
      </div>

      ${renderBreakdownLadder(latest)}

      <div class="section-title">Custom range</div>
      <div class="range-picker">
        <label>
          <span class="range-picker-text">From</span>
          <input type="date" id="brandRangeFrom" value="${from}">
        </label>
        <label>
          <span class="range-picker-text">To</span>
          <input type="date" id="brandRangeTo" value="${to}">
        </label>
      </div>
      <div id="brandRangeResult"></div>

      <div class="section-title">P&amp;L Calendar</div>
      <div id="calContainer">${renderCalendarMonth(recordsByDate, calState.year, calState.month)}</div>
    `;

    const updateBrandRange = () => {
      const f = document.getElementById('brandRangeFrom').value;
      const t = document.getElementById('brandRangeTo').value;
      const resultEl = document.getElementById('brandRangeResult');
      const totals = { netRevenueUSD: 0, adSpendUSD: 0, cogsUSD: 0, netProfitUSD: 0 };
      let hasAny = false;
      records.forEach(rec => {
        if (rec.date >= f && rec.date <= t) {
          hasAny = true;
          totals.netRevenueUSD += rec.netRevenueUSD || 0;
          totals.adSpendUSD += rec.adSpendUSD || 0;
          totals.cogsUSD += rec.cogsUSD || 0;
          totals.netProfitUSD += rec.netProfitUSD || 0;
        }
      });
      if (!hasAny) {
        resultEl.innerHTML = '<div class="empty-state" style="padding:30px 10px;"><div class="empty-state-icon">📅</div>No data in this range.</div>';
        return;
      }
      resultEl.innerHTML = `
        <div class="ladder">
          <div class="ladder-title">Range total (USD)</div>
          <div class="ladder-row"><div class="ladder-label">Net Revenue</div><div class="ladder-value">${fmtUSD(totals.netRevenueUSD)}</div></div>
          <div class="ladder-row"><div class="ladder-label sub">− Ad spend</div><div class="ladder-value neg">${fmtUSD(totals.adSpendUSD)}</div></div>
          <div class="ladder-row"><div class="ladder-label sub">− COGS</div><div class="ladder-value neg">${fmtUSD(totals.cogsUSD)}</div></div>
          <div class="ladder-row"><div class="ladder-label" style="font-weight:700;">Net Profit</div><div class="ladder-value final ${statusClass(totals.netProfitUSD)}">${fmtUSD(totals.netProfitUSD)}</div></div>
        </div>
      `;
    };

    document.getElementById('brandRangeFrom').addEventListener('change', updateBrandRange);
    document.getElementById('brandRangeTo').addEventListener('change', updateBrandRange);
    updateBrandRange();

  } catch (err) {
    content.innerHTML = '<div class="error-state">Could not load this brand&#39;s data. ' + err.message + '</div>';
  }
}

function defaultRangeDates() {
  const yesterday = new Date();
  yesterday.setDate(yesterday.getDate() - 1);
  const str = yesterday.toISOString().split('T')[0];
  return { from: str, to: str };
}

async function renderAllBrands() {
  const { from, to } = defaultRangeDates();
  content.innerHTML = `
    <div class="hero-label">All Brands — Net Profit</div>
    <div class="range-picker">
      <label>
        <span class="range-picker-text">From</span>
        <input type="date" id="rangeFrom" value="${from}">
      </label>
      <label>
        <span class="range-picker-text">To</span>
        <input type="date" id="rangeTo" value="${to}">
      </label>
    </div>
    <div id="allBrandsResult"><div class="loading">Loading…</div></div>

    <div class="section-title">P&amp;L Calendar (combined)</div>
    <div id="allBrandsCalContainer"><div class="loading">Loading…</div></div>
  `;

  document.getElementById('rangeFrom').addEventListener('change', updateAllBrandsRange);
  document.getElementById('rangeTo').addEventListener('change', updateAllBrandsRange);

  await updateAllBrandsRange();
  await renderAllBrandsCalendar();
}

function buildCombinedRecordsByDate(allRecordsArrays) {
  const combined = {};
  allRecordsArrays.forEach(records => {
    records.forEach(rec => {
      if (!combined[rec.date]) {
        combined[rec.date] = { date: rec.date, netRevenueUSD: 0, adSpendUSD: 0, cogsUSD: 0, netProfitUSD: 0 };
      }
      combined[rec.date].netRevenueUSD += rec.netRevenueUSD || 0;
      combined[rec.date].adSpendUSD += rec.adSpendUSD || 0;
      combined[rec.date].cogsUSD += rec.cogsUSD || 0;
      combined[rec.date].netProfitUSD += rec.netProfitUSD || 0;
    });
  });
  Object.values(combined).forEach(rec => {
    rec.marginPct = rec.netRevenueUSD ? rec.netProfitUSD / rec.netRevenueUSD : null;
  });
  return combined;
}

let allBrandsCalState = { year: null, month: null, recordsByDate: null, selectedDate: null };

window.changeAllBrandsCalendarMonth = function(delta) {
  allBrandsCalState.month += delta;
  if (allBrandsCalState.month > 11) { allBrandsCalState.month = 0; allBrandsCalState.year++; }
  if (allBrandsCalState.month < 0) { allBrandsCalState.month = 11; allBrandsCalState.year--; }
  allBrandsCalState.selectedDate = null;
  document.getElementById('allBrandsCalContainer').innerHTML = renderCalendarMonth(
    allBrandsCalState.recordsByDate, allBrandsCalState.year, allBrandsCalState.month, true
  );
};

window.selectAllBrandsCalendarDay = function(dateStr) {
  const rec = allBrandsCalState.recordsByDate[dateStr];
  const detailEl = document.getElementById('allBrandsCalDayDetail');
  if (!rec) { detailEl.innerHTML = ''; return; }
  if (allBrandsCalState.selectedDate === dateStr) {
    allBrandsCalState.selectedDate = null;
    detailEl.innerHTML = '';
    return;
  }
  allBrandsCalState.selectedDate = dateStr;
  detailEl.innerHTML = `
    <div class="cal-detail-card">
      <div class="cal-detail-date">${fmtDateLong(rec.date)} · all brands</div>
      <div class="detail-row"><span class="detail-row-label">Net Revenue</span><span class="detail-row-value">${fmtUSD(rec.netRevenueUSD)}</span></div>
      <div class="detail-row"><span class="detail-row-label">Ad Spend</span><span class="detail-row-value neg">${fmtUSD(rec.adSpendUSD)}</span></div>
      <div class="detail-row"><span class="detail-row-label">COGS</span><span class="detail-row-value neg">${fmtUSD(rec.cogsUSD)}</span></div>
      <div class="detail-row"><span class="detail-row-label">Margin</span><span class="detail-row-value">${fmtPct(rec.marginPct)}</span></div>
      <div class="detail-row" style="border-top:1px solid var(--border);margin-top:6px;padding-top:10px;">
        <span class="detail-row-label" style="font-weight:700;color:var(--ink);">Net Profit</span>
        <span class="detail-row-value ${statusClass(rec.netProfitUSD)}" style="font-weight:700;">${fmtUSD(rec.netProfitUSD)}</span>
      </div>
    </div>
  `;
};

async function renderAllBrandsCalendar() {
  const containerEl = document.getElementById('allBrandsCalContainer');
  try {
    const allRecordsArrays = await Promise.all(BRANDS.map(b => fetchBrandData(b)));
    const recordsByDate = buildCombinedRecordsByDate(allRecordsArrays);
    const dates = Object.keys(recordsByDate).sort();

    if (dates.length === 0) {
      containerEl.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📅</div>No complete days yet.</div>';
      return;
    }

    const latestDate = dates[dates.length - 1];
    const parts = latestDate.split('-').map(Number);
    allBrandsCalState = { year: parts[0], month: parts[1] - 1, recordsByDate, selectedDate: null };

    containerEl.innerHTML = renderCalendarMonth(recordsByDate, allBrandsCalState.year, allBrandsCalState.month, true);
  } catch (err) {
    containerEl.innerHTML = '<div class="error-state">Could not load combined calendar. ' + err.message + '</div>';
  }
}

async function updateAllBrandsRange() {
  const from = document.getElementById('rangeFrom').value;
  const to = document.getElementById('rangeTo').value;
  const resultEl = document.getElementById('allBrandsResult');
  resultEl.innerHTML = '<div class="loading">Loading…</div>';

  try {
    const allRecords = await Promise.all(BRANDS.map(b => fetchBrandData(b)));
    const totals = { netRevenueUSD: 0, adSpendUSD: 0, cogsUSD: 0, netProfitUSD: 0 };
    let hasAny = false;

    allRecords.forEach(records => {
      records.forEach(rec => {
        if (rec.date >= from && rec.date <= to) {
          hasAny = true;
          totals.netRevenueUSD += rec.netRevenueUSD || 0;
          totals.adSpendUSD += rec.adSpendUSD || 0;
          totals.cogsUSD += rec.cogsUSD || 0;
          totals.netProfitUSD += rec.netProfitUSD || 0;
        }
      });
    });

    if (!hasAny) {
      resultEl.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📅</div>No data in this date range yet.</div>';
      return;
    }

    const margin = totals.netRevenueUSD ? totals.netProfitUSD / totals.netRevenueUSD : null;

    resultEl.innerHTML = `
      <div class="hero-number ${statusClass(totals.netProfitUSD)}" style="margin-top:18px;">${fmtUSD(totals.netProfitUSD)}</div>
      <div class="hero-margin">
        <span class="pill ${statusClass(totals.netProfitUSD)}">${totals.netProfitUSD >= 0 ? 'Profit' : 'Loss'}</span>
        ${fmtPct(margin)} margin · ${BRANDS.length} brand${BRANDS.length > 1 ? 's' : ''}
      </div>

      <div class="ladder">
        <div class="ladder-title">Combined Breakdown</div>
        <div class="ladder-row">
          <div class="ladder-label">Net Revenue</div>
          <div class="ladder-value">${fmtUSD(totals.netRevenueUSD)}</div>
        </div>
        <div class="ladder-row">
          <div class="ladder-label sub">− Ad spend</div>
          <div class="ladder-value neg">${fmtUSD(totals.adSpendUSD)}</div>
        </div>
        <div class="ladder-row">
          <div class="ladder-label sub">− COGS</div>
          <div class="ladder-value neg">${fmtUSD(totals.cogsUSD)}</div>
        </div>
        <div class="ladder-row">
          <div class="ladder-label" style="font-weight:700;">Net Profit</div>
          <div class="ladder-value final ${statusClass(totals.netProfitUSD)}">${fmtUSD(totals.netProfitUSD)}</div>
        </div>
      </div>
    `;
  } catch (err) {
    resultEl.innerHTML = '<div class="error-state">Could not load combined data. ' + err.message + '</div>';
  }
}

function renderContent() {
  if (currentBrand === '__all__') {
    renderAllBrands();
  } else {
    const brand = BRANDS.find(b => b.id === currentBrand);
    renderSingleBrand(brand);
  }
}

async function initBrands() {
  content.innerHTML = '<div class="loading">Loading…</div>';
  BRANDS = await fetchBrandsFromServer();
  currentBrand = BRANDS[0].id;
  renderTabs();
  renderContent();
}

initBrands();
</script>
